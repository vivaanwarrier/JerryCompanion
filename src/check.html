<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jerry — sentiment model check</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <span class="brand">CHECK</span>
      <span class="kicker">sentiment model sanity check</span>
    </header>

    <section class="block">
      <h2>Run</h2>
      <div class="block-body">
        <p class="note">
          Runs the pretrained model (Transformers.js, in-browser WASM) against
          sample sentences so you can eyeball whether the labels look reasonable
          before trusting it in the full loop.
        </p>
        <div class="row">
          <button id="run" class="btn-primary">Run check</button>
          <span id="status" class="status"></span>
        </div>
      </div>
    </section>

    <section class="block">
      <h2>Results</h2>
      <div class="block-body">
        <div style="overflow-x:auto">
          <table id="results">
            <thead>
              <tr><th>sentence</th><th>expected</th><th>bucket</th><th>label · score</th><th>src</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="summary" class="note"></p>
      </div>
    </section>

    <footer><a href="./">← back to Jerry</a></footer>
  </div>

  <style>
    #results { width: 100%; border-collapse: collapse; font: 12px/1.5 var(--mono); }
    #results th, #results td {
      text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    #results th {
      color: var(--dim); text-transform: uppercase; font-size: 10px;
      letter-spacing: 0.1em; border-bottom-color: var(--line-strong);
    }
    #results td.match { color: var(--accent); }
    #results td.miss { color: #ff9a3c; }
  </style>

  <script type="module">
    import { classify, preloadSentimentModel } from "./lib/sentiment.js";

    const SAMPLES = [
      ["I had a wonderful day, everything went right", "positive"],
      ["feeling really good and energized this morning", "positive"],
      ["so proud of how the project turned out", "positive"],
      ["honestly a pretty relaxing evening", "positive"],
      ["it was a rough day, lots going on and I'm exhausted", "negative"],
      ["I feel anxious and overwhelmed right now", "negative"],
      ["everything is going wrong and I'm frustrated", "negative"],
      ["kind of a lonely, heavy day", "negative"],
      ["not much happened today, just a normal day", "neutral"],
      ["I went to the store and then came home", "neutral"],
      ["the weather is cloudy with a chance of rain", "neutral"],
      ["I'm okay, nothing special going on", "neutral"],
    ];

    const tbody = document.querySelector("#results tbody");
    const status = document.getElementById("status");
    const summary = document.getElementById("summary");

    document.getElementById("run").addEventListener("click", async () => {
      tbody.innerHTML = "";
      summary.textContent = "";
      status.textContent = "loading model…";
      const ready = await preloadSentimentModel();
      status.textContent = ready ? "model ready — classifying…" : "model unavailable — using lexicon fallback";

      let matches = 0;
      for (const [text, expected] of SAMPLES) {
        const r = await classify(text);
        const isMatch = r.bucket === expected || (expected === "neutral" && r.score < 0.6);
        if (isMatch) matches++;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${text}</td>
          <td>${expected}</td>
          <td class="${isMatch ? "match" : "miss"}">${r.bucket}</td>
          <td>${r.label} · ${r.score.toFixed(3)}</td>
          <td>${r.source}</td>
          <td>${isMatch ? "✓" : "✕"}</td>`;
        tbody.appendChild(tr);
      }
      status.textContent = "done";
      summary.textContent =
        `${matches}/${SAMPLES.length} matched expectations. ` +
        `Neutral is inherently fuzzy for a binary model — a low score on a neutral ` +
        `sentence counts as a match.`;
    });
  </script>
</body>
</html>
